name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="$GITHUB_WORKSPACE"

          # If project is stored in a ZIP archive, extract it
          ZIP_FILE=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name "*.zip" | head -n 1 || true)
          if [ -n "$ZIP_FILE" ]; then
            mkdir -p "$GITHUB_WORKSPACE/extracted"
            unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/extracted"

            CANDIDATE=$(find "$GITHUB_WORKSPACE/extracted" -type f \( -name gradlew -o -name settings.gradle -o -name settings.gradle.kts \) | head -n 1 || true)
            if [ -n "$CANDIDATE" ]; then
              PROJECT_DIR=$(dirname "$CANDIDATE")
            else
              echo "No Android Gradle project found inside ZIP archive."
              exit 1
            fi
          else
            # Fallback: if already in root
            if [ ! -f "$GITHUB_WORKSPACE/gradlew" ] && [ ! -f "$GITHUB_WORKSPACE/settings.gradle" ] && [ ! -f "$GITHUB_WORKSPACE/settings.gradle.kts" ]; then
              echo "No Gradle project found in repository root."
              exit 1
            fi
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Using project dir: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create local debug signing key expected by the project
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ammar-Abu-Daqqa-debug-apk
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
