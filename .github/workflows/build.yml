
name: Build Ammar Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Extract uploaded ZIP
      - name: Extract Android Project
        shell: bash
        run: |
          set -e
          mkdir -p source

          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found"
            exit 1
          fi

          unzip -q "$ZIP_FILE" -d source

          if [ ! -f source/settings.gradle.kts ]; then
            echo "ERROR: settings.gradle.kts not found"
            find source -maxdepth 3 -type f | head -50
            exit 1
          fi

          echo "Project extracted successfully"

      # 3. Setup Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # 5. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # 6. Install required SDK packages
      - name: Install Android SDK Packages
        shell: bash
        run: |
          set -e
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # 7. Build Debug APK
      - name: Build APK
        working-directory: source
        run: |
          gradle --no-daemon assembleDebug

      # 8. Check APK
      - name: Verify APK
        run: |
          APK=$(find source/app/build/outputs/apk/debug \
            -name '*.apk' | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK was not generated"
            exit 1
          fi

          echo "APK generated: $APK"

      # 9. Upload APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ammar-Abu-Daqqa-APK
          path: source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
